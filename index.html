<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess 4KB</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;text-align:center;margin:0;padding:10px}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:96vw;max-width:420px;margin:10px auto;border:3px solid #5a3a1a}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer}
.w{background:#ecdab8}.b{background:#a97a4e}
.sel{outline:3px solid yellow}
button{padding:12px 20px;font-size:18px;background:#22c55e;color:#fff;border:0;border-radius:10px}
</style></head>
<body>
<h2>♟️ Chess 4KB</h2><div id="st">Putih jalan dulu</div>
<div id="board"></div>
<button onclick="location.reload()">🔄 Main Lagi</button>
<p>Main berdua, 1 HP gantian</p>
<script>
let B=[
['r','n','b','q','k','b','n','r'],
['p','p','p','p','p','p','p','p'],
['','','','','','','',''],
['','','','','','','',''],
['','','','','','','',''],
['','','','','','','',''],
['P','P','P','P','P','P','P','P'],
['R','N','B','Q','K','B','N','R']];
let M={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',P:'♙',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔'};
let turn='W',sel=null,board=document.getElementById('board');
function draw(){
 board.innerHTML='';
 B.forEach((row,r)=>row.forEach((c,col)=>{
  let d=document.createElement('div');
  d.className='cell '+((r+col)%2?'b':'w');
  d.textContent=M[c]||'';
  d.style.color=c==c.toUpperCase()&&c?'#fff':'#000';
  if(sel&&sel[0]==r&&sel[1]==col)d.classList.add('sel');
  d.onclick=()=>click(r,col);
  board.appendChild(d);
 }));
}
function click(r,c){
 let p=B[r][c];
 let isW=p&&p==p.toUpperCase();
 if(sel){
  let [sr,sc]=sel;
  if(sr==r&&sc==c){sel=null;draw();return}
  B[r][c]=B[sr][sc];B[sr][sc]='';
  turn=turn=='W'?'B':'W';
  document.getElementById('st').textContent=turn=='W'?'Giliran Putih':'Giliran Hitam';
  sel=null;draw();return;
 }
 if(p&&((turn=='W'&&isW)||(turn=='B'&&!isW))){sel=[r,c];draw()}
}
draw();
</script></body></html>
